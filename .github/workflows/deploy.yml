# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild purely to refresh the Player Starrings snapshot below. The
  # starrings are published monthly, so a weekly build keeps them current
  # without anyone pushing. Note `schedule` only fires from the default branch.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Snapshots cricketleinster.ie into public/starrings.json so the browser
      # reads the starrings same-origin instead of via a third-party CORS bridge.
      # Best effort: that site is reachable from some datacenter IPs and not
      # others, and a failure here must not block a deploy. When it fails, the
      # snapshot committed to the repo ships instead — older starrings, not none.
      - name: Refresh Player Starrings snapshot
        continue-on-error: true
        run: npm run fetch-starrings

      - name: Build
        run: npm run build
        env:
          # PUBLIC, client-safe values stored as GitHub repo Secrets.
          # RLS protects the data; the anon key is meant to be shipped.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
